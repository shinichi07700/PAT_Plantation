openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /report/data:
    get:
      operationId: getReportData
      summary: Read marketing visits and source freshness
      responses:
        "200":
          description: Verified dataset, with explicit snapshot status on sync failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportData"
  /report/refresh:
    post:
      operationId: refreshReportData
      summary: Refresh read-only Google Sheets source
      responses:
        "200":
          description: Dataset and sync outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportData"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Visit:
      type: object
      required: [id, date, salesName, company, contact, commodity, activityType, result, products, nextAgenda, nextDate, location, sourceRow]
      properties:
        id: { type: string }
        date: { type: string }
        salesName: { type: string }
        company: { type: string }
        contact: { type: string }
        commodity: { type: string }
        activityType: { type: string }
        result: { type: string }
        products: { type: string }
        nextAgenda: { type: string }
        nextDate: { type: string }
        location: { type: string }
        sourceRow: { type: integer }
        photoUrl: { type: string }
        videoUrl: { type: string }
        gmapsUrl: { type: string }
    ReportData:
      type: object
      required: [visits, sourceTitle, fetchedAt, today, timezone, mode, syncError, coverageStart, coverageEnd, excludedRows]
      properties:
        visits:
          type: array
          items: { $ref: "#/components/schemas/Visit" }
        sourceTitle: { type: string }
        fetchedAt: { type: string }
        today: { type: string }
        timezone: { type: string }
        mode: { type: string, enum: [live, snapshot] }
        syncError: { type: ["string", "null"] }
        coverageStart: { type: string }
        coverageEnd: { type: string }
        excludedRows: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

